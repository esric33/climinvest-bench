[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climinvest-bench"
version = "0.1.0rc2"
description = "Benchmark for evidence-grounded investment report generation and maintenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND MPL-2.0"
license-files = [
  "LICENSE",
  "LICENSES/MPL-2.0.txt",
  "LICENSES/TraceMark-MIT.txt",
  "THIRD_PARTY_NOTICES.md",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
paper = ["numpy>=2,<3", "matplotlib>=3.9,<4"]

[project.scripts]
benchrun = "benchmarks.benchrunner.cli:main"
climinvest-benchmark = "benchmarks.react_report_building.__main__:main"

[tool.setuptools.packages.find]
include = ["benchmarks*"]

[tool.setuptools.package-data]
"benchmarks.react_report_building" = [
  "data/**/*.json",
  "data/**/*.yaml",
  "data/*.yaml",
  "prompts/*.md",
  "schemas/*.json",
  "evaluation/*.js",
  "vendor/tracemark-core/*.js",
  "vendor/tracemark-core/*.md",
  "v2/**/*.json",
  "v2/**/*.js",
  "v2/**/*.md",
]
